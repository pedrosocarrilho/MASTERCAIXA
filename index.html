<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Caixa · MasterPrint</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#28292d">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#F5F6F8;--surface:#fff;--ink:#111827;--muted:#6B7280;--line:#E5E7EB;--brand:#0079B8;--brand2:#0094DA;--soft:#E6F5FC;--ok:#047857;--okbg:#D1FAE5;--danger:#B91C1C;--head:#28292d;--headink:#fff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#151618;--surface:#1F2023;--ink:#ECEDEF;--muted:#9A9DA5;--line:#34363B;--brand:#0A8CCB;--brand2:#2BA6E0;--soft:#12303F;--ok:#34D399;--okbg:#0E3B2E;--danger:#F87171;--head:#101113;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#151618;--surface:#1F2023;--ink:#ECEDEF;--muted:#9A9DA5;--line:#34363B;--brand:#0A8CCB;--brand2:#2BA6E0;--soft:#12303F;--ok:#34D399;--okbg:#0E3B2E;--danger:#F87171;--head:#101113;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:400 14px/1.5 Inter,system-ui,-apple-system,"Segoe UI",sans-serif}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
input,select{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:9px 11px;width:100%}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--brand2);outline-offset:1px}
.btn{padding:10px 16px;border-radius:8px;font-weight:600;background:var(--brand);color:#fff}
.btn.sec{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.btn.ok{background:var(--ok);color:#fff}.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.danger{background:none;color:var(--danger);padding:6px 8px}
/* login */
#auth{min-height:100vh;display:grid;place-items:center;padding:20px;background:var(--head)}
.card{background:var(--surface);border-radius:14px;padding:32px;width:min(400px,100%);box-shadow:0 20px 60px rgba(0,0,0,.35)}
.card h1{margin:0 0 4px;font-size:22px;letter-spacing:-.01em}.card p{margin:0 0 20px;color:var(--muted)}
.f{margin-bottom:14px}.f label{display:block;font-weight:600;font-size:13px;margin-bottom:5px}
.err{color:var(--danger);font-size:13px;min-height:20px;margin:-4px 0 10px}
.mark{background:#28292d;border-radius:12px;padding:20px 28px;margin-bottom:20px}.mark img{display:block;width:190px;max-width:100%;margin:0 auto}#hl img{height:38px;width:auto;display:block}#hl{display:flex}
/* app */
header{background:var(--head);color:var(--headink);display:flex;align-items:center;gap:24px;padding:0 24px;height:59px;border-bottom:3px solid;border-image:linear-gradient(90deg,#00AEEF,#EC008C,#FFF200) 1}
.brand{font-weight:700;font-size:16px;white-space:nowrap;display:flex;align-items:center;gap:10px}
nav{display:flex;height:100%;gap:2px;overflow-x:auto}
nav button{padding:0 16px;color:#AEB8D0;font-weight:500;border-bottom:3px solid transparent;white-space:nowrap}
nav button[aria-selected="true"]{color:#fff;border-bottom-color:#FFF200}
.who{margin-left:auto;display:flex;align-items:center;gap:12px;font-size:13px;white-space:nowrap}
.who small{color:#AEB8D0;display:block;line-height:1.1}
.who button{border:1px solid #3B4663;border-radius:8px;padding:6px 12px;color:#fff}
.wrap{max-width:1440px;margin:0 auto;padding:20px 24px}
.pg-caixa{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:20px;align-items:start}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px}
.pad{padding:18px}
.tools{display:flex;gap:10px;margin-bottom:12px;flex-wrap:wrap}.tools input{flex:1;min-width:200px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.chip{padding:5px 13px;border-radius:99px;border:1px solid var(--line);color:var(--muted);font-weight:500}
.chip[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:#fff}
.list{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.prod{display:flex;justify-content:space-between;align-items:center;gap:10px;text-align:left;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.prod:hover{border-color:var(--brand2);background:var(--soft)}
.prod b{font-weight:600;display:block}.prod small{color:var(--muted)}
.prod .pr{font-weight:700;white-space:nowrap}
.cart{position:sticky;top:12px;display:flex;flex-direction:column;max-height:calc(100vh - 80px)}
.cart h2{margin:0;font-size:15px;padding:14px 18px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
.cart h2 button{font-size:12px;color:var(--muted);font-weight:500}
#items{overflow:auto;padding:0 18px;flex:1;min-height:110px}
.empty{color:var(--muted);text-align:center;padding:32px 8px}
.it{padding:12px 0;border-bottom:1px solid var(--line);display:grid;grid-template-columns:1fr auto;gap:6px 10px}
.it b{font-weight:600}.it .t{font-weight:700;text-align:right}
.it .q{display:flex;gap:8px;align-items:center;color:var(--muted);font-size:12px}.it .q input{width:84px;padding:5px 8px}
.it .rm{color:var(--danger);font-size:12px;text-align:right}
.tot{padding:14px 18px;border-top:1px solid var(--line)}
.r{display:flex;justify-content:space-between;align-items:center;margin-bottom:7px;color:var(--muted)}
.dsc{display:flex;gap:6px}.dsc select{width:62px}.dsc input{width:84px}
.total{display:flex;justify-content:space-between;align-items:baseline;font-weight:700;font-size:15px;margin:10px 0 12px;color:var(--ink)}
.total b{font-size:28px;letter-spacing:-.02em}
.tbl{width:100%;border-collapse:collapse}.tbl th{text-align:left;font-size:12px;color:var(--muted);font-weight:600;padding:8px 10px;border-bottom:1px solid var(--line)}
.tbl td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:middle}.tbl input,.tbl select{padding:7px 9px}
.scroll{overflow-x:auto}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:16px}
.stat{padding:14px 16px;border:1px solid var(--line);border-radius:10px}.stat small{color:var(--muted)}.stat b{display:block;font-size:22px}
.tag{display:inline-block;padding:1px 9px;border-radius:99px;background:var(--soft);color:var(--brand);font-weight:600;font-size:12px}
.hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;gap:10px;flex-wrap:wrap}.hd h2{margin:0;font-size:17px}
.addrow{display:grid;grid-template-columns:2fr 1.2fr .8fr .8fr auto;gap:8px;margin-bottom:16px}
dialog{border:0;border-radius:14px;padding:0;width:min(440px,94vw);background:var(--surface);color:var(--ink);box-shadow:0 30px 80px rgba(0,0,0,.4)}
dialog::backdrop{background:rgba(8,12,24,.6)}
.dl{padding:24px}.dl h3{margin:0 0 14px;font-size:18px}
.me{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px}
.me button{padding:11px;border-radius:8px;border:1.5px solid var(--line);font-weight:600}
.me button[aria-pressed="true"]{border-color:var(--brand2);background:var(--soft);color:var(--brand)}
.qk{display:flex;gap:6px;margin:8px 0;flex-wrap:wrap}.qk button{padding:5px 12px;border:1px solid var(--line);border-radius:99px;font-weight:500}
.chg{display:flex;justify-content:space-between;font-weight:700;font-size:17px;margin:12px 0}
.act{display:flex;gap:10px;margin-top:16px}.act .btn{flex:1}
.rc{font-family:ui-monospace,Menlo,monospace;font-size:13px}.rc .r{color:var(--ink);margin-bottom:3px}
.okc{width:46px;height:46px;border-radius:50%;background:var(--okbg);color:var(--ok);display:grid;place-items:center;font-size:24px;margin:0 auto 10px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--head);color:#fff;padding:10px 18px;border-radius:8px;z-index:50}
@media (max-width:980px){.pg-caixa{grid-template-columns:1fr}.cart{position:static;max-height:none}.wrap{padding:14px}header{padding:0 14px;gap:12px}.addrow{grid-template-columns:1fr 1fr}.stats{grid-template-columns:1fr}.brand{display:none}}
.cf{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:12px 18px 0}
.s4{grid-template-columns:repeat(4,1fr)}.sec2{margin:24px 0 10px;font-size:14px;font-weight:700}
.cxb{border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:18px;background:var(--soft)}.cxb .acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.st{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:7px}
tr[data-sid]{cursor:pointer}tr[data-sid]:hover td{background:var(--soft)}.x td{opacity:.5;text-decoration:line-through}
.seg{display:flex;gap:6px;flex-wrap:wrap}
textarea{width:100%;font:12px ui-monospace,Menlo,monospace;border:1px solid var(--line);border-radius:8px;padding:9px;background:var(--surface);color:var(--ink)}
@media (max-width:980px){.s4{grid-template-columns:1fr 1fr}.cf{grid-template-columns:1fr}}
.lnk{background:none;color:var(--brand);font-weight:600;text-decoration:underline;padding:6px 0;display:block;margin:6px auto 0}
.code{font:700 20px ui-monospace,Menlo,monospace;letter-spacing:.05em;text-align:center;padding:14px;border:2px dashed var(--line);border-radius:10px;margin:8px 0;user-select:all;word-break:break-all}
.tag.lt{background:#FEE2E2;color:#B91C1C}.act.wrap{flex-wrap:wrap}
</style></head><body>

<div id="auth"></div>

<div id="app" hidden>
<header>
  <div class="brand"><span id="hl"></span>MasterPrint</div>

  <div class="who"><div><span id="uname"></span><small id="urole"></small></div><button id="pw">Senha</button><button id="out">Sair</button></div>
</header>
<div class="wrap">

  <div class="panel pad">
    <div class="tools"><input id="q" placeholder="Buscar serviço ou produto  ( / )" autocomplete="off"><button class="btn sec" id="av">+ Item avulso</button></div>
    <div class="chips" id="chips"></div>
    <div class="list" id="list"></div>
  </div>

    <h2>Pedido atual <button id="clr">Limpar</button></h2>
    <div class="cf"><input id="cust" placeholder="Cliente (opcional)" aria-label="Cliente"><input id="obs" placeholder="Telefone ou observação" aria-label="Observação"></div><div id="items"></div>

      <div class="r"><span>Subtotal</span><span id="sub"></span></div>
      <div class="r"><span>Desconto</span><span class="dsc"><select id="dt" aria-label="Tipo"><option>%</option><option>R$</option></select><input id="dv" type="number" min="0" step="0.01" value="0" aria-label="Desconto"></span></div>
      <div class="total"><span>Total</span><b id="total"></b></div>
      <button class="btn ok" id="pay" style="width:100%;padding:14px;font-size:15px" disabled>Receber pagamento (F2)</button><button class="btn sec" id="sv" style="width:100%;margin-top:8px" disabled>Salvar como orçamento ou pedido</button>
    </div>
  </aside>
 </section>

/* ---------- AUTH ---------- */
function authView(){
 const first=!users.length;
 $('#auth').hidden=false;$('#app').hidden=true;
 $('#auth').innerHTML=`<form class="card" id="af" autocomplete="on"><div class="mark">${LOGOFULL}</div><h1>${first?'Primeiro acesso':'Entrar no caixa'}</h1><p>${first?'Crie a conta da administradora. Ela poderá cadastrar os operadores.':'Informe seu usuário e senha.'}</p>
 ${first?'<div class="f"><label for="an">Nome completo</label><input id="an" required></div>':''}
 <div class="f"><label for="au">Usuário</label><input id="au" required autocomplete="username" autocapitalize="off"></div>
 <div class="f"><label for="ap">Senha</label><input id="ap" type="password" required minlength="6" autocomplete="${first?'new-password':'current-password'}"></div>
 ${first?'<div class="f"><label for="ap2">Confirmar senha</label><input id="ap2" type="password" required autocomplete="new-password"></div>':''}
 <div class="err" id="ae" role="alert"></div><button class="btn" style="width:100%" id="ab">${first?'Criar conta e entrar':'Entrar'}</button>${first?'':'<button type="button" class="lnk" id="forgot">Esqueci minha senha</button>'}</form>`;
 $('#af').onsubmit=async e=>{e.preventDefault();const err=m=>$('#ae').textContent=m;err('');
  const u=$('#au').value.trim().toLowerCase(),p=$('#ap').value;
  try{
  if(first){
   if(p.length<6)return err('A senha precisa ter ao menos 6 caracteres.');
   if(p!==$('#ap2').value)return err('As senhas não conferem.');
   const s=newSalt();users=[{id:Date.now(),name:$('#an').value.trim(),user:u,role:'admin',salt:s,hash:await hash(p,s)}];S.set('users',users);const rc=await newRecovery();enter(users[0]);showRecovery(rc);
  }else{
   if(Date.now()<lockUntil)return err(`Muitas tentativas. Aguarde ${Math.ceil((lockUntil-Date.now())/1000)}s.`);
   const x=users.find(v=>v.user===u),h=await hash(p,x?x.salt:'x');
   if(x&&h===x.hash){tries=0;enter(x)}else{tries++;if(tries>=5){lockUntil=Date.now()+30000;tries=0}err('Usuário ou senha incorretos.')}
  }}catch(ex){err('Não foi possível validar o login neste navegador. Abra a página em https.')}
 };
 if(!first)$('#forgot').onclick=forgot;$(first?'#an':'#au').focus();
}
function enter(u){me=u;sess.set(String(u.id));$('#auth').hidden=true;$('#app').hidden=false;$('#auth').innerHTML='';
 $('#hl').innerHTML=LOGO;$('#uname').textContent=u.name;$('#urole').textContent=u.role==='admin'?'Administradora':'Operador';
 const tabs=[['caixa','Caixa'],['pedidos','Pedidos'],['vendas','Vendas e caixa'],...(u.role==='admin'?[['precos','Preços e produtos'],['users','Usuários']]:[])];
 $('#nav').innerHTML=tabs.map(t=>`<button role="tab" data-p="${t[0]}">${t[1]}</button>`).join('');
 cart={};go('caixa')}
$('#out').onclick=()=>{sess.set(null);me=null;cart={};authView()};

/* ---------- NAV ---------- */
function go(p){page=p;['caixa','pedidos','vendas','precos','users'].forEach(k=>$('#pg-'+k).hidden=k!==p);
 document.querySelectorAll('#nav button').forEach(b=>b.setAttribute('aria-selected',b.dataset.p===p));
 ({caixa:()=>{chips();list();items()},vendas:vendas,pedidos:pedidos,precos:precos,users:usersView})[p]()}
$('#nav').onclick=e=>{if(e.target.dataset.p)go(e.target.dataset.p)};

/* ---------- CAIXA ---------- */
const custom={};const find=id=>prods.find(x=>x.id==id)||custom[id];
const sub=()=>r2(Object.entries(cart).reduce((s,[id,n])=>{const p=find(id);return s+(p?p.price*n:0)},0));
const dsc=()=>{const s=sub(),d=disc.t==='%'?s*disc.v/100:disc.v;return r2(Math.min(Math.max(d||0,0),s))};
const total=()=>r2(sub()-dsc());
function chips(){const cs=['Todos',...new Set(prods.map(p=>p.cat))];if(!cs.includes(cat))cat='Todos';
 $('#chips').innerHTML=cs.map(c=>`<button class="chip" aria-pressed="${c===cat}" data-c="${esc(c)}">${esc(c)}</button>`).join('')}
function list(){const q=$('#q').value.trim().toLowerCase();
 const r=prods.filter(p=>(cat==='Todos'||p.cat===cat)&&(!q||p.name.toLowerCase().includes(q)));
 $('#list').innerHTML=r.length?r.map(p=>`<button class="prod" data-id="${p.id}"><span><b>${esc(p.name)}</b><small>por ${esc(p.unit)}</small></span><span class="pr">${brl(p.price)}</span></button>`).join(''):'<div class="empty">Nenhum item encontrado.</div>'}
function items(){const e=Object.entries(cart).filter(([id])=>find(id));
 $('#items').innerHTML=e.length?e.map(([id,n])=>{const p=find(id);return `<div class="it"><b>${esc(p.name)}</b><span class="t">${brl(p.price*n)}</span><span class="q"><input type="number" min="${step(p)}" step="${step(p)}" value="${n}" data-q="${id}" aria-label="Quantidade"> ${esc(p.unit)} × ${brl(p.price)}</span><button class="rm" data-r="${id}">Remover</button></div>`}).join(''):'<div class="empty">Nenhum item no pedido. Selecione um serviço ao lado.</div>';
 $('#sub').textContent=brl(sub());$('#total').textContent=brl(total());$('#pay').disabled=!e.length;$('#sv').disabled=!e.length}
function add(id){cart[id]=r2((cart[id]||0)+step(prods.find(p=>p.id==id)));items()}
$('#chips').onclick=e=>{if(e.target.dataset.c){cat=e.target.dataset.c;chips();list()}};
$('#list').onclick=e=>{const b=e.target.closest('.prod');if(b)add(+b.dataset.id)};
$('#items').onchange=e=>{const id=e.target.dataset.q;if(id){const v=parseFloat(e.target.value);if(v>0)cart[id]=v;else delete cart[id];items()}};
$('#items').onclick=e=>{if(e.target.dataset.r){delete cart[e.target.dataset.r];items()}};
$('#clr').onclick=()=>{cart={};cartOrder=null;items()};
$('#q').oninput=list;
$('#dv').oninput=e=>{disc.v=parseFloat(e.target.value)||0;items()};$('#dt').onchange=e=>{disc.t=e.target.value;items()};
document.addEventListener('keydown',e=>{if(!me)return;if(e.key==='/'&&!/INPUT|SELECT/.test(document.activeElement.tagName)){e.preventDefault();go('caixa');$('#q').focus()}if(e.key==='F2'){e.preventDefault();if(page==='caixa')openPay()}});

/* ---------- PAGAMENTO ---------- */
function openPay(){if(!Object.keys(cart).length||$('#dlg').open)return;if(!cx.open)return openCx(openPay);method='Dinheiro';received=0;payView();$('#dlg').showModal()}
function payView(){const t=total(),cash=method==='Dinheiro';
 $('#dlb').innerHTML=`<h3>Receber ${brl(t)}</h3><div class="me">${['Dinheiro','PIX','Débito','Crédito'].map(m=>`<button data-me="${m}" aria-pressed="${m===method}">${m}</button>`).join('')}</div>`+
 (cash?`<div class="f"><label for="rc">Valor recebido</label><input id="rc" type="number" min="0" step="0.01" value="${received||''}" placeholder="0,00"></div><div class="qk"><button data-q="${t}">Valor exato</button>${[20,50,100,200].filter(v=>v>t).map(v=>`<button data-q="${v}">${brl(v)}</button>`).join('')}</div><div class="chg"><span>Troco</span><span id="chg">${brl(Math.max(received-t,0))}</span></div>`:`<p style="color:var(--muted)">Confirme após ${method==='PIX'?'a compensação do PIX':'a aprovação na maquininha'}.</p>`)+
 `<div class="act"><button class="btn sec" id="cn">Voltar</button><button class="btn ok" id="ok" ${cash&&received<t?'disabled':''}>Confirmar venda</button></div>`;
 $('#cn').onclick=()=>$('#dlg').close();$('#ok').onclick=finish;
 const r=$('#rc');if(r){r.oninput=e=>{received=parseFloat(e.target.value)||0;$('#chg').textContent=brl(Math.max(received-t,0));$('#ok').disabled=received<t};r.focus()}}
$('#dlb').onclick=e=>{const d=e.target.dataset;if(d.me){method=d.me;received=0;payView()}if(d.q!==undefined){received=+d.q;payView()}};
$('#pay').onclick=openPay;
/* ---------- DIÁLOGOS, RECIBO ---------- */
const dt=t=>new Date(t).toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'});
const hm=t=>new Date(t).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
const num=id=>parseFloat($(id).value);
function modal(h,body,okTxt,fn){$('#dlb').innerHTML=`<h3>${h}</h3>${body}<div class="err" id="mer" role="alert"></div><div class="act"><button class="btn sec" id="mc">Cancelar</button><button class="btn ok" id="mo">${okTxt}</button></div>`;$('#mc').onclick=()=>$('#dlg').close();$('#mo').onclick=()=>{const m=fn();if(m)$('#mer').textContent=m};if(!$('#dlg').open)$('#dlg').showModal();const f=$('#dlb input');if(f)f.focus()}
const ask=(msg,fn)=>modal('Confirmar',`<p style="margin:0 0 8px">${msg}</p>`,'Confirmar',()=>{$('#dlg').close();fn()});
const hr='<hr style="border:0;border-top:1px dashed var(--line)">';
const rcpt=s=>`<div class="rc"><div class="r"><b>Venda nº ${s.n}${s.canceled?' · CANCELADA':''}</b><span>${dt(s.t)}</span></div>${s.cust?`<div class="r"><span>Cliente</span><span>${esc(s.cust)}</span></div>`:''}${s.obs?`<div class="r"><span>Obs.</span><span>${esc(s.obs)}</span></div>`:''}${hr}${s.items.map(i=>`<div class="r"><span>${i.qty} ${esc(i.unit)} · ${esc(i.name)}</span><span>${brl(i.qty*i.price)}</span></div>`).join('')}${hr}<div class="r"><span>Subtotal</span><span>${brl(s.sub)}</span></div><div class="r"><span>Desconto</span><span>−${brl(s.disc)}</span></div><div class="r"><b>Total · ${s.method}</b><b>${brl(s.total)}</b></div>${s.method==='Dinheiro'?`<div class="r"><span>Recebido</span><span>${brl(s.received)}</span></div><div class="r"><span>Troco</span><span>${brl(s.received-s.total)}</span></div>`:''}<div class="r"><span>Atendente</span><span>${esc(s.by)}</span></div></div>`;

function finish(){const t=total(),its=Object.entries(cart).map(([id,q])=>{const p=find(id);return{name:p.name,unit:p.unit,qty:q,price:p.price}});
 const s={n:sales.reduce((m,x)=>Math.max(m,x.n),0)+1,t:Date.now(),by:me.name,cust:$('#cust').value.trim(),obs:$('#obs').value.trim(),items:its,sub:sub(),disc:dsc(),total:t,method,received:method==='Dinheiro'?received:t};
 sales.unshift(s);S.set('sales',sales);const oo=cartOrder&&orders.find(o=>o.n===cartOrder);if(oo){oo.sale=s.n;if(oo.status==='Orçamento')oo.status='Em produção';S.set('orders',orders)}cartOrder=null;cart={};disc.v=0;$('#dv').value=0;$('#cust').value='';$('#obs').value='';items();
 $('#dlb').innerHTML=`<div class="okc">✓</div><h3 style="text-align:center">Venda registrada</h3>${rcpt(s)}<div class="act"><button class="btn sec" id="pr">Imprimir</button><button class="btn" id="nv">Nova venda</button></div>`;
 $('#nv').onclick=()=>{$('#dlg').close();$('#q').focus()};$('#pr').onclick=()=>printDoc('Recibo nº '+s.n,rcpt(s))}

/* ---------- CONTROLE DE CAIXA ---------- */
let cx=S.get('cx',{open:false,start:0,t:0,moves:[]}),closures=S.get('closures',[]);
const cashSales=()=>r2(sales.filter(s=>!s.canceled&&s.method==='Dinheiro'&&s.t>=cx.t).reduce((a,s)=>a+s.total,0));
const mv=()=>r2(cx.moves.reduce((a,m)=>a+m.val,0));
const expected=()=>r2(cx.start+cashSales()+mv());
const saveCx=()=>S.set('cx',cx);
function openCx(cb){modal('Abrir caixa','<div class="f"><label for="cxs">Troco inicial em dinheiro (R$)</label><input id="cxs" type="number" min="0" step="0.01" value="0"></div>','Abrir caixa',()=>{const v=num('#cxs');if(!(v>=0))return 'Informe o troco inicial.';cx={open:true,start:r2(v),t:Date.now(),by:me.name,moves:[]};saveCx();$('#dlg').close();toast('Caixa aberto');if(cb)cb();else if(page==='vendas')vendas()})}
function moveCx(type){const sg=type==='sang';modal(sg?'Sangria (retirada)':'Suprimento (entrada)','<div class="f"><label for="mv1">Valor (R$)</label><input id="mv1" type="number" min="0.01" step="0.01"></div><div class="f"><label for="mv2">Motivo</label><input id="mv2" placeholder="Ex.: depósito, compra de papel"></div>','Registrar',()=>{const v=num('#mv1');if(!(v>0))return 'Informe um valor maior que zero.';if(sg&&v>expected())return 'A sangria é maior que o dinheiro esperado no caixa.';cx.moves.push({t:Date.now(),val:sg?-r2(v):r2(v),note:$('#mv2').value.trim(),by:me.name});saveCx();$('#dlg').close();toast(sg?'Sangria registrada':'Suprimento registrado');vendas()})}
function closeCx(){const e=expected();modal('Fechar caixa',`<p style="margin:0 0 12px">Dinheiro esperado: <b>${brl(e)}</b></p><div class="f"><label for="cc">Valor contado na gaveta (R$)</label><input id="cc" type="number" min="0" step="0.01"></div>`,'Fechar caixa',()=>{const v=num('#cc');if(!(v>=0))return 'Informe o valor contado.';const d=r2(v-e);closures.unshift({...cx,end:Date.now(),esp:e,cnt:r2(v),diff:d,by2:me.name});closures=closures.slice(0,60);S.set('closures',closures);cx={open:false,start:0,t:0,moves:[]};saveCx();$('#dlg').close();toast(d===0?'Caixa fechado sem diferença':'Caixa fechado. Diferença: '+brl(d));vendas()})}

/* ---------- ITEM AVULSO ---------- */
$('#av').onclick=()=>modal('Item avulso','<div class="f"><label for="a1">Descrição</label><input id="a1" placeholder="Ex.: Arte e diagramação"></div><div class="f"><label for="a2">Valor unitário (R$)</label><input id="a2" type="number" min="0.01" step="0.01"></div><div class="f"><label for="a3">Quantidade</label><input id="a3" type="number" min="1" step="1" value="1"></div>','Adicionar ao pedido',()=>{const n=$('#a1').value.trim(),v=num('#a2'),q=num('#a3');if(!n)return 'Informe a descrição.';if(!(v>0))return 'Informe um valor maior que zero.';if(!(q>0))return 'Informe a quantidade.';const id='x'+Date.now();custom[id]={id,name:n,unit:'un',price:r2(v)};cart[id]=q;items();$('#dlg').close()});

/* ---------- VENDAS E CAIXA ---------- */
let per='hoje';
const inPer=s=>{const d=new Date(s.t),n=new Date();return per==='hoje'?d.toDateString()===n.toDateString():per==='7'?s.t>=Date.now()-6048e5:per==='mes'?d.getMonth()===n.getMonth()&&d.getFullYear()===n.getFullYear():true};
const backup=`<h3 class="sec2">Backup dos dados</h3><p style="margin:0 0 8px;color:var(--muted)">Os dados ficam neste navegador. Gere o backup, copie o texto e guarde em local seguro. Para restaurar, cole o texto no campo e toque em Restaurar.</p><textarea id="bk" rows="3" aria-label="Texto do backup"></textarea><div class="act" style="max-width:360px"><button class="btn sec" id="bkg">Gerar backup</button><button class="btn" id="bkr">Restaurar</button></div>`;
function vendas(){
 const all=sales.filter(inPer),ok=all.filter(s=>!s.canceled),sum=r2(ok.reduce((a,s)=>a+s.total,0)),by={Dinheiro:0,PIX:0,Débito:0,Crédito:0},top={};
 ok.forEach(s=>{by[s.method]=r2((by[s.method]||0)+s.total);s.items.forEach(i=>{const t=top[i.name]||(top[i.name]={q:0,v:0,u:i.unit});t.q=r2(t.q+i.qty);t.v=r2(t.v+i.qty*i.price)})});
 const tp=Object.entries(top).sort((a,b)=>b[1].v-a[1].v).slice(0,5);
 const cashH=cx.open?`<div class="cxb"><b><span class="st" style="background:var(--ok)"></span>Caixa aberto desde ${hm(cx.t)} · ${esc(cx.by)}</b><div class="stats s4" style="margin:12px 0 0"><div class="stat"><small>Troco inicial</small><b>${brl(cx.start)}</b></div><div class="stat"><small>Vendas em dinheiro</small><b>${brl(cashSales())}</b></div><div class="stat"><small>Sangrias e suprimentos</small><b>${brl(mv())}</b></div><div class="stat"><small>Dinheiro esperado</small><b>${brl(expected())}</b></div></div><div class="acts"><button class="btn sec" data-cx="sang">Sangria</button><button class="btn sec" data-cx="sup">Suprimento</button><button class="btn" data-cx="fech">Fechar caixa</button></div></div>`:`<div class="cxb"><b><span class="st" style="background:var(--danger)"></span>Caixa fechado</b><p style="margin:6px 0 0;color:var(--muted)">Abra o caixa com o troco inicial para registrar vendas.</p><div class="acts"><button class="btn" data-cx="abrir">Abrir caixa</button></div></div>`;
 const th=(t,r)=>`<th${r?' style="text-align:right"':''}>${t}</th>`;
 $('#pg-vendas').innerHTML=`<div class="hd"><h2>Vendas e caixa</h2></div>${cashH}<div class="seg" style="margin-bottom:14px">${[['hoje','Hoje'],['7','7 dias'],['mes','Este mês'],['tudo','Tudo']].map(([k,l])=>`<button class="chip" aria-pressed="${k===per}" data-per="${k}">${l}</button>`).join('')}</div><div class="stats"><div class="stat"><small>Total vendido</small><b>${brl(sum)}</b></div><div class="stat"><small>Vendas</small><b>${ok.length}</b></div><div class="stat"><small>Ticket médio</small><b>${brl(ok.length?sum/ok.length:0)}</b></div></div><div class="stats s4">${Object.entries(by).map(([m,v])=>`<div class="stat"><small>${m}</small><b>${brl(v)}</b></div>`).join('')}</div>`
 +(tp.length?`<h3 class="sec2">Mais vendidos</h3><div class="scroll"><table class="tbl"><tr>${th('Serviço')}${th('Quantidade')}${th('Faturamento',1)}</tr>${tp.map(([n,t])=>`<tr><td>${esc(n)}</td><td>${t.q} ${esc(t.u)}</td><td style="text-align:right">${brl(t.v)}</td></tr>`).join('')}</table></div>`:'')
 +`<h3 class="sec2">Vendas do período</h3>`+(all.length?`<div class="scroll"><table class="tbl"><tr>${th('Nº')}${th('Data')}${th('Cliente')}${th('Itens')}${th('Pagamento')}${th('Atendente')}${th('Total',1)}</tr>${all.map(s=>`<tr data-sid="${s.n}" class="${s.canceled?'x':''}"><td>${s.n}</td><td>${dt(s.t)}</td><td>${s.cust?esc(s.cust):'—'}</td><td>${esc(s.items.map(i=>i.name).join(', '))}</td><td><span class="tag">${s.method}</span></td><td>${esc(s.by)}</td><td style="text-align:right"><b>${brl(s.total)}</b></td></tr>`).join('')}</table></div><p style="color:var(--muted);margin:8px 0 0;font-size:12px">Toque em uma venda para ver o recibo.</p>`:'<div class="empty">Nenhuma venda neste período.</div>')
 +(closures.length?`<h3 class="sec2">Fechamentos de caixa</h3><div class="scroll"><table class="tbl"><tr>${th('Data')}${th('Responsável')}${th('Esperado',1)}${th('Contado',1)}${th('Diferença',1)}</tr>${closures.slice(0,8).map(c=>`<tr><td>${dt(c.end)}</td><td>${esc(c.by2)}</td><td style="text-align:right">${brl(c.esp)}</td><td style="text-align:right">${brl(c.cnt)}</td><td style="text-align:right;${c.diff?'color:var(--danger);font-weight:700':''}">${brl(c.diff)}</td></tr>`).join('')}</table></div>`:'')
 +(me.role==='admin'?backup:'')}
$('#pg-vendas').onclick=e=>{const d=e.target.dataset,id=e.target.id;
 if(d.per){per=d.per;vendas();return}
 if(d.cx){({abrir:()=>openCx(),sang:()=>moveCx('sang'),sup:()=>moveCx('sup'),fech:closeCx})[d.cx]();return}
 if(id==='bkg'){const j=JSON.stringify({v:2,prods,sales,users,closures,cx,orders,rec:S.get('rec',null),audits});$('#bk').value=j;$('#bk').select();try{navigator.clipboard.writeText(j).then(()=>toast('Backup copiado'),()=>toast('Selecione e copie o texto'))}catch(x){toast('Selecione e copie o texto')}return}
 if(id==='bkr'){if(!$('#bk').value.trim())return toast('Cole o texto do backup no campo');
  ask('Restaurar substitui os dados atuais por este backup. Continuar?',()=>{try{const b=JSON.parse($('#bk').value);if(!Array.isArray(b.prods)||!Array.isArray(b.sales)||!Array.isArray(b.users)||!b.users.length)throw 0;prods=b.prods;sales=b.sales;users=b.users;closures=b.closures||[];cx=b.cx||{open:false,start:0,t:0,moves:[]};orders=b.orders||[];audits=b.audits||[];S.set('orders',orders);S.set('audit',audits);S.set('rec',b.rec||null);S.set('prods',prods);S.set('sales',sales);S.set('users',users);S.set('closures',closures);saveCx();toast('Backup restaurado');vendas()}catch(x){toast('Backup inválido')}});return}
 const tr=e.target.closest('tr[data-sid]');if(tr){const s=sales.find(x=>x.n==tr.dataset.sid);if(!s)return;
  $('#dlb').innerHTML=`<h3>Recibo</h3>${rcpt(s)}<div class="act"><button class="btn sec" id="mc">Fechar</button><button class="btn sec" id="pr">Imprimir</button>${me.role==='admin'&&!s.canceled?'<button class="btn" id="cs" style="background:var(--danger)">Cancelar venda</button>':''}</div>`;
  $('#mc').onclick=()=>$('#dlg').close();$('#pr').onclick=()=>printDoc('Recibo nº '+s.n,rcpt(s));const c=$('#cs');if(c)c.onclick=()=>ask(`Cancelar a venda nº ${s.n}? Ela deixa de contar nos totais.`,()=>{s.canceled=true;s.cby=me.name;S.set('sales',sales);toast('Venda cancelada');vendas()});
  $('#dlg').showModal()}};

/* ---------- PREÇOS (admin) ---------- */
function precos(){
 $('#pg-precos').innerHTML=`<div class="hd"><h2>Preços e produtos</h2><span style="color:var(--muted)">As alterações são salvas ao sair do campo.</span></div>
 <form class="addrow" id="np"><input id="n1" placeholder="Nome do serviço" required><input id="n2" placeholder="Categoria" list="cl" required><input id="n3" placeholder="Unidade" required><input id="n4" type="number" min="0" step="0.01" placeholder="Preço" required><button class="btn">Adicionar</button></form><datalist id="cl">${[...new Set(prods.map(p=>p.cat))].map(c=>`<option value="${esc(c)}">`).join('')}</datalist>
 <div class="scroll"><table class="tbl"><tr><th>Serviço</th><th>Categoria</th><th>Unidade</th><th>Preço (R$)</th><th></th></tr>${prods.map(p=>`<tr><td><input data-f="name" data-id="${p.id}" value="${esc(p.name)}"></td><td><input data-f="cat" data-id="${p.id}" value="${esc(p.cat)}"></td><td><input data-f="unit" data-id="${p.id}" value="${esc(p.unit)}" style="width:90px"></td><td><input data-f="price" data-id="${p.id}" type="number" min="0" step="0.01" value="${p.price}" style="width:110px"></td><td><button class="btn danger" data-del="${p.id}">Excluir</button></td></tr>`).join('')}</table></div>`;
 $('#np').onsubmit=e=>{e.preventDefault();prods.push({id:Date.now(),name:$('#n1').value.trim(),cat:$('#n2').value.trim(),unit:$('#n3').value.trim(),price:r2(parseFloat($('#n4').value)||0)});S.set('prods',prods);toast('Serviço adicionado');precos()}}
$('#pg-precos').onchange=e=>{const d=e.target.dataset;if(!d.f)return;const p=prods.find(x=>x.id==d.id);let v=e.target.value.trim();
 if(d.f==='price'){v=parseFloat(v);if(!(v>=0)){e.target.value=p.price;return toast('Preço inválido')}v=r2(v);e.target.value=v}else if(!v){e.target.value=p[d.f];return toast('Campo obrigatório')}
 p[d.f]=v;S.set('prods',prods);toast('Alteração salva')};
$('#pg-precos').onclick=e=>{const id=e.target.dataset.del;if(id)ask('Excluir este serviço do catálogo?',()=>{prods=prods.filter(p=>p.id!=id);delete cart[id];S.set('prods',prods);$('#dlg').close();precos()})};

/* ---------- USUÁRIOS (admin) ---------- */
function usersView(){usersBase();$('#pg-users').insertAdjacentHTML('beforeend',extraUsers())}
function usersBase(){
 $('#pg-users').innerHTML=`<div class="hd"><h2>Usuários</h2></div><form class="addrow" id="nu" style="grid-template-columns:1.5fr 1fr 1fr 1fr auto"><input id="u1" placeholder="Nome" required><input id="u2" placeholder="Usuário" required autocomplete="off"><input id="u3" type="password" placeholder="Senha (mín. 6)" minlength="6" required autocomplete="new-password"><select id="u4"><option value="op">Operador</option><option value="admin">Administradora</option></select><button class="btn">Cadastrar</button></form><div class="err" id="ue"></div>
 <div class="scroll"><table class="tbl"><tr><th>Nome</th><th>Usuário</th><th>Perfil</th><th></th></tr>${users.map(u=>`<tr><td>${esc(u.name)}</td><td>${esc(u.user)}</td><td><span class="tag">${u.role==='admin'?'Administradora':'Operador'}</span></td><td>${u.id===me.id?'<small style="color:var(--muted)">você</small>':`<button class="btn danger" data-up="${u.id}" style="color:var(--brand)">Redefinir senha</button><button class="btn danger" data-ud="${u.id}">Remover</button>`}</td></tr>`).join('')}</table></div>`;
 $('#nu').onsubmit=async e=>{e.preventDefault();const u=$('#u2').value.trim().toLowerCase();if(users.some(x=>x.user===u))return $('#ue').textContent='Este usuário já existe.';
  const s=newSalt();users.push({id:Date.now(),name:$('#u1').value.trim(),user:u,role:$('#u4').value,salt:s,hash:await hash($('#u3').value,s)});S.set('users',users);toast('Usuário cadastrado');usersView()}}
$('#pg-users').onclick=e=>{const id=e.target.dataset.ud;if(id)ask('Remover este usuário?',()=>{users=users.filter(u=>u.id!=id);S.set('users',users);usersView()})};

let tt;function toast(m){document.querySelectorAll('.toast').forEach(x=>x.remove());const d=document.createElement('div');d.className='toast';d.textContent=m;document.body.appendChild(d);clearTimeout(tt);tt=setTimeout(()=>d.remove(),1800)}

const TH=(t,r)=>`<th${r?' style="text-align:right"':''}>${t}</th>`;
/* ---------- SEGURANÇA: RECUPERAÇÃO, SENHA, REGISTRO ---------- */
let audits=S.get('audit',[]);
const audit=t=>{audits.unshift({t:Date.now(),text:t});audits=audits.slice(0,30);S.set('audit',audits)};
const genCode=()=>{const a='ABCDEFGHJKLMNPQRSTUVWXYZ23456789',r=crypto.getRandomValues(new Uint8Array(16));return [0,4,8,12].map(i=>[...r.slice(i,i+4)].map(x=>a[x%a.length]).join('')).join('-')};
async function newRecovery(){const c=genCode(),s=newSalt();S.set('rec',{salt:s,hash:await hash(c.replace(/-/g,''),s)});return c}
const showRecovery=c=>modal('Código de recuperação',`<p style="margin:0 0 8px">Anote este código em papel e guarde em lugar seguro. Ele é a forma de recuperar a senha da administradora e <b>não será mostrado novamente</b>.</p><div class="code">${c}</div>`,'Já guardei',()=>{$('#dlg').close()});
function forgot(){modal('Recuperar acesso','<div class="f"><label for="rc1">Código de recuperação</label><input id="rc1" autocomplete="off" placeholder="XXXX-XXXX-XXXX-XXXX"></div><div class="f"><label for="rc2">Usuário da administradora</label><input id="rc2" autocomplete="off" autocapitalize="off"></div><div class="f"><label for="rc3">Nova senha (mín. 6 caracteres)</label><input id="rc3" type="password" autocomplete="new-password"></div><button type="button" class="lnk" id="nocode">Não tenho o código</button>','Redefinir senha',()=>{recover()});$('#nocode').onclick=hardReset}
async function recover(){const e=m=>$('#mer').textContent=m;try{const rec=S.get('rec',null),u=users.find(x=>x.user===$('#rc2').value.trim().toLowerCase()&&x.role==='admin'),p=$('#rc3').value;
 if(!rec)return e('Esta conta não tem código de recuperação. Use “Não tenho o código”.');if(p.length<6)return e('A nova senha precisa ter ao menos 6 caracteres.');
 const c=$('#rc1').value.toUpperCase().replace(/[^A-Z0-9]/g,'');if(!u||await hash(c,rec.salt)!==rec.hash)return e('Código ou usuário incorreto.');
 u.salt=newSalt();u.hash=await hash(p,u.salt);S.set('users',users);audit('Senha da administradora redefinida com o código de recuperação');$('#dlg').close();toast('Senha redefinida. Entre com a nova senha.')}catch(x){e('Não foi possível redefinir agora.')}}
function hardReset(){modal('Redefinir acesso','<p style="margin:0 0 10px">Isto remove <b>todos os usuários e senhas</b> deste aparelho e abre o “Primeiro acesso”. Vendas, pedidos e preços são mantidos. Quem redefinir passa a ser a administradora, e a ação fica registrada. Digite REDEFINIR para confirmar.</p><div class="f"><input id="hr1" autocomplete="off" aria-label="Confirmação"></div>','Redefinir acesso',()=>{if($('#hr1').value.trim().toUpperCase()!=='REDEFINIR')return 'Digite REDEFINIR para confirmar.';users=[];S.set('users',users);S.set('rec',null);audit('Acesso redefinido sem código: todos os usuários foram removidos');sess.set(null);me=null;$('#dlg').close();authView()})}
async function chgPw(){const e=m=>$('#mer').textContent=m;try{if($('#p2').value.length<6)return e('A nova senha precisa ter ao menos 6 caracteres.');if(await hash($('#p1').value,me.salt)!==me.hash)return e('Senha atual incorreta.');me.salt=newSalt();me.hash=await hash($('#p2').value,me.salt);S.set('users',users);$('#dlg').close();toast('Senha alterada')}catch(x){e('Não foi possível alterar agora.')}}
$('#pw').onclick=()=>modal('Alterar minha senha','<div class="f"><label for="p1">Senha atual</label><input id="p1" type="password" autocomplete="current-password"></div><div class="f"><label for="p2">Nova senha (mín. 6 caracteres)</label><input id="p2" type="password" autocomplete="new-password"></div>','Salvar senha',()=>{chgPw()});
const extraUsers=()=>`<h3 class="sec2">Recuperação de acesso</h3><p style="margin:0 0 8px;color:var(--muted)">${S.get('rec',null)?'Há um código de recuperação ativo.':'Não há código de recuperação.'} Gerar um novo código invalida o anterior.</p><button class="btn sec" id="newcode">Gerar novo código</button>`+(audits.length?`<h3 class="sec2">Registro de segurança</h3><div class="scroll"><table class="tbl"><tr>${TH('Data')}${TH('Evento')}</tr>${audits.slice(0,10).map(a=>`<tr><td>${dt(a.t)}</td><td>${esc(a.text)}</td></tr>`).join('')}</table></div>`:'');
$('#pg-users').addEventListener('click',e=>{const d=e.target.dataset;
 if(e.target.id==='newcode')ask('Gerar um novo código de recuperação? O código anterior deixará de valer.',async()=>{try{const c=await newRecovery();audit('Novo código de recuperação gerado por '+me.name);showRecovery(c);usersView()}catch(x){toast('Não foi possível gerar o código')}});
 if(d.up){const u=users.find(x=>x.id==d.up);if(u)modal('Redefinir senha de '+esc(u.name),'<div class="f"><label for="np1">Nova senha (mín. 6 caracteres)</label><input id="np1" type="password" autocomplete="new-password"></div>','Salvar senha',()=>{(async()=>{const p=$('#np1').value;if(p.length<6)return $('#mer').textContent='A senha precisa ter ao menos 6 caracteres.';u.salt=newSalt();u.hash=await hash(p,u.salt);S.set('users',users);audit('Senha de '+u.name+' redefinida por '+me.name);$('#dlg').close();toast('Senha redefinida')})()})}});

/* ---------- IMPRESSÃO ---------- */
function printDoc(title,body){try{const f=document.createElement('iframe');f.style.cssText='position:fixed;right:0;bottom:0;width:0;height:0;border:0';document.body.appendChild(f);const d=f.contentWindow.document;d.open();
 d.write(`<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><title>${esc(title)}</title><style>@page{margin:6mm}body{font:12px/1.45 ui-monospace,Menlo,Consolas,monospace;color:#000;width:72mm;margin:0 auto}h1{font:700 15px Arial,sans-serif;text-align:center;margin:0}p{text-align:center;margin:0 0 8px;font-size:11px}.r{display:flex;justify-content:space-between;gap:8px;margin-bottom:2px}hr{border:0!important;border-top:1px dashed #000!important;margin:6px 0}</style></head><body><h1>MasterPrint</h1><p>Comunicação Visual</p>${body}<p style="margin-top:12px">Obrigado pela preferência!</p></body></html>`);d.close();
 setTimeout(()=>{try{f.contentWindow.focus();f.contentWindow.print()}catch(x){toast('Impressão indisponível neste ambiente')}setTimeout(()=>f.remove(),5000)},300)}catch(x){toast('Impressão indisponível neste ambiente')}}

/* ---------- PEDIDOS E ORÇAMENTOS ---------- */
let orders=S.get('orders',[]),ost='Abertos',cartOrder=null;
const OPEN=['Orçamento','Em produção','Pronto'];
const ld=t=>{const d=new Date(t);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const fpz=p=>p.split('-').reverse().join('/');
const late=o=>o.status==='Em produção'&&o.prazo<ld(Date.now());
const ordHtml=o=>`<div class="rc"><div class="r"><b>Pedido nº ${o.n}</b><span>${o.status}</span></div><div class="r"><span>Cliente</span><span>${esc(o.cust)}</span></div>${o.obs?`<div class="r"><span>Contato/obs.</span><span>${esc(o.obs)}</span></div>`:''}<div class="r"><span>Prazo</span><span>${fpz(o.prazo)}</span></div>${hr}${o.items.map(i=>`<div class="r"><span>${i.qty} ${esc(i.unit)} · ${esc(i.name)}</span><span>${brl(i.qty*i.price)}</span></div>`).join('')}${hr}<div class="r"><span>Desconto</span><span>−${brl(o.disc)}</span></div><div class="r"><b>Total</b><b>${brl(o.total)}</b></div><div class="r"><span>Pagamento</span><span>${o.sale?'Pago · venda nº '+o.sale:'A receber'}</span></div></div>`;
function saveOrder(){const ex=cartOrder&&orders.find(o=>o.n===cartOrder),dflt=ld(Date.now()+2*864e5);
 modal(ex?`Atualizar pedido nº ${ex.n}`:'Salvar pedido',`<div class="f"><label for="o1">Cliente</label><input id="o1" value="${esc($('#cust').value)}"></div><div class="f"><label for="o2">Telefone ou observação</label><input id="o2" value="${esc($('#obs').value)}"></div><div class="f"><label for="o3">Prazo de entrega</label><input id="o3" type="date" value="${ex?ex.prazo:dflt}"></div>${ex?'':'<div class="f"><label for="o4">Salvar como</label><select id="o4"><option>Orçamento</option><option>Em produção</option></select></div>'}`,'Salvar',()=>{
  const c=$('#o1').value.trim(),pz=$('#o3').value;if(!c)return 'Informe o nome do cliente.';if(!pz)return 'Informe o prazo de entrega.';
  const base={cust:c,obs:$('#o2').value.trim(),prazo:pz,items:Object.entries(cart).map(([id,q])=>{const p=find(id);return{name:p.name,unit:p.unit,qty:q,price:p.price}}),sub:sub(),disc:dsc(),total:total()};
  if(ex)Object.assign(ex,base);else orders.unshift({n:orders.reduce((m,x)=>Math.max(m,x.n),0)+1,t:Date.now(),by:me.name,status:$('#o4').value,sale:null,...base});
  S.set('orders',orders);const n=ex?ex.n:orders[0].n;cart={};cartOrder=null;disc.v=0;$('#dv').value=0;$('#cust').value='';$('#obs').value='';items();$('#dlg').close();toast('Pedido nº '+n+' salvo');go('pedidos')})}
$('#sv').onclick=saveOrder;
function loadOrder(o){cart={};o.items.forEach(i=>{const id='x'+Math.random().toString(36).slice(2,8);custom[id]={id,name:i.name,unit:i.unit,price:i.price};cart[id]=i.qty});cartOrder=o.n;$('#cust').value=o.cust||'';$('#obs').value=o.obs||'';disc={t:'R$',v:o.disc||0};$('#dv').value=disc.v;$('#dt').value='R$';$('#dlg').close();go('caixa');toast('Pedido nº '+o.n+' carregado no caixa')}
function setSt(o,s){o.status=s;S.set('orders',orders);$('#dlg').close();toast('Pedido nº '+o.n+': '+s);pedidos()}
function ordDetail(o){const nx={'Orçamento':['Em produção','Aprovar e iniciar produção'],'Em produção':['Pronto','Marcar como pronto'],'Pronto':['Entregue','Marcar como entregue']}[o.status];
 $('#dlb').innerHTML=`<h3>Pedido nº ${o.n}</h3>${ordHtml(o)}<div class="act"><button class="btn sec" id="mc">Fechar</button><button class="btn sec" id="pr">Imprimir</button>${!o.sale&&o.status!=='Cancelado'&&o.status!=='Entregue'?'<button class="btn" id="oc">Abrir no caixa</button>':''}</div>${nx?`<div class="act"><button class="btn ok" id="on">${nx[1]}</button></div>`:''}${OPEN.includes(o.status)?'<div class="act"><button class="btn danger" id="ox">Cancelar pedido</button></div>':''}`;
 $('#mc').onclick=()=>$('#dlg').close();$('#pr').onclick=()=>printDoc('Pedido nº '+o.n,ordHtml(o));
 const oc=$('#oc');if(oc)oc.onclick=()=>Object.keys(cart).length&&cartOrder!==o.n?ask('O pedido atual do caixa será substituído. Continuar?',()=>loadOrder(o)):loadOrder(o);
 const on=$('#on');if(on)on.onclick=()=>nx[0]==='Entregue'&&!o.sale?ask('Este pedido ainda não foi pago. Marcar como entregue mesmo assim?',()=>setSt(o,'Entregue')):setSt(o,nx[0]);
 const ox=$('#ox');if(ox)ox.onclick=()=>ask(`Cancelar o pedido nº ${o.n}?${o.sale?' A venda já registrada precisa ser cancelada à parte, na aba Vendas e caixa.':''}`,()=>setSt(o,'Cancelado'));
 $('#dlg').showModal()}
function pedidos(){const cnt=s=>orders.filter(o=>o.status===s).length,lt=orders.filter(late).length,l=orders.filter(o=>ost==='Todos'||(ost==='Abertos'?OPEN.includes(o.status):o.status===ost));
 $('#pg-pedidos').innerHTML=`<div class="hd"><h2>Pedidos e orçamentos</h2></div><div class="stats s4"><div class="stat"><small>Orçamentos</small><b>${cnt('Orçamento')}</b></div><div class="stat"><small>Em produção</small><b>${cnt('Em produção')}</b></div><div class="stat"><small>Atrasados</small><b style="${lt?'color:var(--danger)':''}">${lt}</b></div><div class="stat"><small>Prontos para retirada</small><b>${cnt('Pronto')}</b></div></div><div class="seg" style="margin-bottom:14px">${['Abertos','Orçamento','Em produção','Pronto','Entregue','Cancelado','Todos'].map(k=>`<button class="chip" aria-pressed="${k===ost}" data-st="${k}">${k}</button>`).join('')}</div>`+
 (l.length?`<div class="scroll"><table class="tbl"><tr>${TH('Nº')}${TH('Cliente')}${TH('Itens')}${TH('Prazo')}${TH('Status')}${TH('Pagamento')}${TH('Total',1)}</tr>${l.map(o=>`<tr data-oid="${o.n}" class="${o.status==='Cancelado'?'x':''}"><td>${o.n}</td><td>${esc(o.cust)}</td><td>${esc(o.items.map(i=>i.name).join(', '))}</td><td>${fpz(o.prazo)}${late(o)?' <span class="tag lt">Atrasado</span>':''}</td><td><span class="tag">${o.status}</span></td><td>${o.sale?'Pago':'A receber'}</td><td style="text-align:right"><b>${brl(o.total)}</b></td></tr>`).join('')}</table></div><p style="color:var(--muted);margin:8px 0 0;font-size:12px">Toque em um pedido para ver detalhes, mudar o status ou imprimir.</p>`:'<div class="empty">Nenhum pedido aqui. No caixa, monte os itens e use “Salvar como orçamento ou pedido”.</div>')}
$('#pg-pedidos').onclick=e=>{const k=e.target.dataset.st;if(k){ost=k;pedidos();return}const tr=e.target.closest('tr[data-oid]');if(tr){const o=orders.find(x=>x.n==tr.dataset.oid);if(o)ordDetail(o)}};

/* ---------- INÍCIO ---------- */
(()=>{const id=sess.get(),u=id&&users.find(x=>String(x.id)===id);u?enter(u):authView()})();
</script><script>if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))</script>
</body></html>
